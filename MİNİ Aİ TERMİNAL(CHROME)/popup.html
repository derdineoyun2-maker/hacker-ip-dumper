<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background-color: #090d16;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      width: 350px;
      padding: 12px;
      margin: 0;
    }
    .header {
      color: #22c55e;
      font-size: 12px;
      border-bottom: 1px dashed #334155;
      padding-bottom: 5px;
      margin-bottom: 8px;
    }
    #terminal-output {
      height: 200px;
      overflow-y: auto;
      font-size: 11px;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .line {
      margin-bottom: 4px;
    }
    .prompt-box {
      display: flex;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 4px;
      border-radius: 4px;
    }
    .prompt-symbol {
      color: #22c55e;
      margin-right: 6px;
      font-weight: bold;
    }
    #cmd-input {
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      outline: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header">[+] HACKER_AI_TERM v2.0 // 'help' yaz</div>
  <div id="terminal-output">
    <div class="line" style="color:#94a3b8;">[*] Sistem hazır. Hedef siteye bağlanıldı.</div>
  </div>
  <div class="prompt-box">
    <span class="prompt-symbol">></span>
    <input type="text" id="cmd-input" placeholder="Komut yaz (örn: ip, links, help)..." autofocus>
  </div>
  <script src="popup.js"></script>
</body>
</html>
